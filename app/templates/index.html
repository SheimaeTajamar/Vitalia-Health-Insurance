<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#001f3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vitalia Sensor</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="tag">Vitalia Health Insurance</p>
      <h1>Lectura de sensores moviles</h1>
      <p class="subtitle">
        Accede al acelerometro y giroscopio con permisos del navegador y monitoreo IA en tiempo real.
      </p>
    </header>

    <section class="controls card">
      <div class="control-grid">
        <button id="permissionBtn" class="btn btn-primary">Conceder permisos</button>
        <button id="toggleBtn" class="btn btn-secondary" disabled>Iniciar lectura</button>
      </div>

      <div class="install-row">
        <button id="installBtn" class="btn btn-outline" hidden>Instalar acceso directo</button>
      </div>
    </section>

    <section class="card chart-card">
      <div class="chart-head">
        <h2>Visualizacion temporal</h2>
      </div>

      <div class="action-content">
        <img id="actionIcon" src="/static/icons/person-standing.svg" alt="icono de accion" width="80" height="80">
        <p id="actionLabel">Esperando datos</p>
      </div>

      <div class="chart-grid">
        <div>
          <h3>Aceleracion</h3>
          <canvas id="accChart" width="760" height="220"></canvas>
        </div>
        <div>
          <h3>Giroscopio</h3>
          <canvas id="gyroChart" width="760" height="220"></canvas>
        </div>
      </div>
    </section>

    <footer class="footnote" style="display:none">
      <p id="statusText"></p>
      <p id="envText"></p>
    </footer>
  </main>

  <script src="/static/js/sensors.js"></script>
</body>
</html>
